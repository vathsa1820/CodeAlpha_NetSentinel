# =============================================================================
# NetSentinel — Snort Configuration
# Phase 2 — Snort Configuration
# OS: Windows 11
# Snort Version: 2.9.x
# =============================================================================

# -----------------------------------------------------------------------------
# NETWORK VARIABLES
# Define the network we are protecting.
# Change HOME_NET to match your actual local subnet.
# -----------------------------------------------------------------------------
var HOME_NET 192.168.0.0/24
var EXTERNAL_NET !$HOME_NET

# Common server ports
var HTTP_PORTS 80
var HTTPS_PORTS 443

# -----------------------------------------------------------------------------
# PATH VARIABLES
# Snort's standard installation directory on Windows.
# -----------------------------------------------------------------------------
var RULE_PATH C:\Snort\rules
var LOG_PATH  C:\Snort\log
include C:\Snort\etc\classification.config

# -----------------------------------------------------------------------------
# DECODER SETTINGS
# Use default decoder — no changes needed for Phase 2.
# -----------------------------------------------------------------------------
config disable_decode_alerts
config disable_tcpopt_experimental_alerts
config disable_tcpopt_obsolete_alerts
config disable_tcpopt_ttcp_alerts

# -----------------------------------------------------------------------------
# PREPROCESSORS
# Minimal set needed for HTTP rule matching (Rule 3).
# http_inspect allows Snort to inspect HTTP URIs.
# -----------------------------------------------------------------------------
preprocessor http_inspect: global iis_unicode_map C:\Snort\etc\unicode.map 1252

preprocessor http_inspect_server: server default \
    profile all \
    ports { 80 8080 8000 } \
    oversize_dir_length 500

# stream5 — needed for flow:established matching (Rule 3)
preprocessor stream5_global: track_tcp yes, track_udp no
preprocessor stream5_tcp: policy windows, detect_anomalies

# -----------------------------------------------------------------------------
# OUTPUT PLUGINS
# Log alerts in two formats:
#   1. alert_fast  — human-readable one-line format (easy to read)
#   2. log_tcpdump — pcap packet capture (for later analysis)
# -----------------------------------------------------------------------------

# Fast alert log — one line per alert, easy to read and parse
output alert_fast: netsentinel_alerts.txt

# Unified2 binary format — for tools like Barnyard2 / future parsers
output unified2: filename netsentinel_unified2.log, limit 128

# -----------------------------------------------------------------------------
# RULES
# Load only the NetSentinel custom rules for Phase 2.
# Do not load the full Snort community ruleset — unnecessary for this phase.
# -----------------------------------------------------------------------------
include ../rules/netsentinel.rules
